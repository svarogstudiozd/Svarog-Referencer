name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub website

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: SvarogReferencer-Windows-VST3
          path: build/SvarogReferencer_artefacts/Release/VST3/Svarog Referencer.vst3
          if-no-files-found: error

      - name: Upload Windows Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SvarogReferencer-Windows-Standalone
          path: build/SvarogReferencer_artefacts/Release/Standalone/Svarog Referencer.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # --- Stage the plugin bundles and build a .pkg installer ---
      - name: Build macOS Installer Package
        run: |
          set -e

          # Create staging directory structure mirroring the install targets
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Applications

          # Copy the built bundles into the staging directory
          cp -R "build/SvarogReferencer_artefacts/Release/AU/Svarog Referencer.component" \
                "pkg_root/Library/Audio/Plug-Ins/Components/"
          cp -R "build/SvarogReferencer_artefacts/Release/VST3/Svarog Referencer.vst3" \
                "pkg_root/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/SvarogReferencer_artefacts/Release/Standalone/Svarog Referencer.app" \
                "pkg_root/Applications/"

          # Build the .pkg installer, installing the staged tree at /
          pkgbuild --root pkg_root \
                   --identifier "com.svarogstudio.referencer" \
                   --version "1.0.0" \
                   --install-location "/" \
                   "Svarog Referencer.pkg"

          ls -la "Svarog Referencer.pkg"

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: SvarogReferencer-macOS-Installer
          path: Svarog Referencer.pkg
          if-no-files-found: error
